<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SketchUp Model in Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        canvas { display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: sans-serif; font-size: 20px; color: #333;
        }
    </style>
    <!-- Import Map для подключения Three.js через CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Загрузка модели...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Базовая настройка сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0); // Светло-серый фон

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        // Важные настройки для корректного отображения цветов и теней
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 2. Управление камерой (мышкой)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Плавная остановка
        controls.dampingFactor = 0.05;
        controls.minDistance = 1;
        controls.maxDistance = 50;

        // 3. Освещение (Модели из SketchUp часто требуют хорошего света)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7.5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Пол (опционально, чтобы было понимание пространства)
        const planeGeometry = new THREE.PlaneGeometry(20, 20);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = 0; // Подстройте под размер вашей модели
        plane.receiveShadow = true;
        scene.add(plane);

        // 4. Загрузка модели
        const loader = new GLTFLoader();
        const loadingScreen = document.getElementById('loading');

        loader.load(
            'model.glb', // <-- ПУТЬ К ВАШЕЙ МОДЕЛИ
            function (gltf) {
                const model = gltf.scene;
                
                // --- АВТОМАТИЧЕСКОЕ ЦЕНТРИРОВАНИЕ И МАСШТАБИРОВАНИЕ ---
                // Модели из SketchUp часто имеют странный размер или сдвинуты от центра
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // Сдвигаем модель так, чтобы её центр был в (0,0,0)
                model.position.x -= center.x;
                model.position.y -= center.y;
                model.position.z -= center.z;

                // Масштабируем модель до разумного размера (например, макс. сторона = 4 единицы)
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 4 / maxDim;
                model.scale.setScalar(scale);

                // Пересчитываем границы после масштабирования для камеры
                const newBox = new THREE.Box3().setFromObject(model);
                const newCenter = newBox.getCenter(new THREE.Vector3());
                const newSize = newBox.getSize(new THREE.Vector3());
                
                // Настраиваем камеру и контролы на модель
                controls.target.copy(newCenter);
                camera.position.set(newCenter.x + newSize.x, newCenter.y + newSize.y, newCenter.z + newSize.z);
                controls.update();

                // Включаем тени для всех мешей в модели
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(model);
                loadingScreen.style.display = 'none'; // Скрываем экран загрузки
            },
            function (xhr) {
                // Прогресс загрузки
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            function (error) {
                console.error('Ошибка загрузки модели:', error);
                loadingScreen.innerText = 'Ошибка загрузки! Проверьте путь к файлу.';
            }
        );

        // 5. Адаптация под изменение размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Цикл анимации (рендеринг)
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Необходимо для плавности (enableDamping)
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
